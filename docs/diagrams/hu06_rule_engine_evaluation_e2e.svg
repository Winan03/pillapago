<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 1020" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .uml-title { fill: #1e293b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 19px; font-weight: 700; }
      .uml-subtitle { fill: #64748b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; }
      
      .lifeline-line { stroke: #0284c7; stroke-width: 1.5; stroke-dasharray: 6 5; }
      
      .participant-box { fill: #f0f9ff; stroke: #0284c7; stroke-width: 1.5; rx: 4; }
      .participant-name { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; text-anchor: middle; }
      .participant-type { fill: #0369a1; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; text-anchor: middle; }
      
      .actor-icon { stroke: #0284c7; stroke-width: 1.8; fill: none; stroke-linecap: round; }
      
      .activation-bar { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1.5; }
      .activation-bar-sub { fill: #bae6fd; stroke: #0284c7; stroke-width: 1.5; }
      
      .msg-call { stroke: #0f172a; stroke-width: 1.5; marker-end: url(#arrow-sync); }
      .msg-return { stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 5 4; marker-end: url(#arrow-reply); }
      
      .msg-label { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; font-weight: 500; }
      .return-label { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 500; font-style: italic; }
      
      .fragment-box { fill: none; stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 4 2; }
      .fragment-header { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 1.2; }
      .fragment-label { fill: #334155; font-family: ui-monospace, monospace; font-size: 11px; font-weight: 700; }
    </style>
    
    <marker id="arrow-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f172a" />
    </marker>
    <marker id="arrow-reply" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <rect width="1150" height="1020" class="bg" />

  <!-- Diagram Title -->
  <text x="50" y="38" class="uml-title">Diagrama de Secuencia UML: HU-06 Evaluación en el Motor de Reglas</text>
  <text x="50" y="58" class="uml-subtitle">Pipeline Core: Evaluación determinista Java 21 puro (ArchUnit), cálculo de score acumulado y veredicto</text>

  <!-- PARTICIPANTS -->
  <!-- 1. Actor: Tienda/Comercio (X = 90) -->
  <circle cx="90" cy="92" r="10" class="actor-icon" />
  <line x1="90" y1="102" x2="90" y2="122" class="actor-icon" />
  <line x1="74" y1="110" x2="106" y2="110" class="actor-icon" />
  <line x1="90" y1="122" x2="78" y2="140" class="actor-icon" />
  <line x1="90" y1="122" x2="102" y2="140" class="actor-icon" />
  <text x="90" y="156" class="participant-name">Tienda / M2M</text>
  <text x="90" y="170" class="participant-type">&lt;&lt;actor&gt;&gt;</text>
  <line x1="90" y1="178" x2="90" y2="980" class="lifeline-line" />

  <!-- 2. Controller: EvaluationController (X = 290) -->
  <rect x="205" y="122" width="170" height="46" class="participant-box" />
  <text x="290" y="142" class="participant-name">EvaluationController</text>
  <text x="290" y="157" class="participant-type">&lt;&lt;boundary / hot-path&gt;&gt;</text>
  <line x1="290" y1="168" x2="290" y2="980" class="lifeline-line" />

  <!-- 3. Engine: RuleEvaluator (X = 530) -->
  <rect x="455" y="122" width="150" height="46" class="participant-box" />
  <text x="530" y="142" class="participant-name">RuleEvaluator</text>
  <text x="530" y="157" class="participant-type">&lt;&lt;pure java core&gt;&gt;</text>
  <line x1="530" y1="168" x2="530" y2="980" class="lifeline-line" />

  <!-- 4. ConditionEvaluator (X = 770) -->
  <rect x="690" y="122" width="160" height="46" class="participant-box" />
  <text x="770" y="142" class="participant-name">ConditionEvaluator</text>
  <text x="770" y="157" class="participant-type">&lt;&lt;operator engine&gt;&gt;</text>
  <line x1="770" y1="168" x2="770" y2="980" class="lifeline-line" />

  <!-- 5. ScoreCalculator (X = 990) -->
  <rect x="915" y="122" width="150" height="46" class="participant-box" />
  <text x="990" y="142" class="participant-name">ScoreCalculator</text>
  <text x="990" y="157" class="participant-type">&lt;&lt;decision aggregator&gt;&gt;</text>
  <line x1="990" y1="168" x2="990" y2="980" class="lifeline-line" />


  <!-- SCENARIO: EVALUACIÓN DE TRANSACCIÓN -->
  <rect x="40" y="195" width="1070" height="760" class="fragment-box" />
  <path d="M 40 195 L 180 195 L 190 210 L 40 210 Z" class="fragment-header" />
  <text x="50" y="206" class="fragment-label">opt: Evaluar Transacción</text>

  <!-- Activation bars -->
  <rect x="85" y="215" width="10" height="720" class="activation-bar" />
  <rect x="285" y="222" width="10" height="705" class="activation-bar" />
  <rect x="525" y="240" width="10" height="665" class="activation-bar" />
  <rect x="765" y="280" width="10" height="280" class="activation-bar-sub" />
  <rect x="985" y="600" width="10" height="260" class="activation-bar-sub" />

  <!-- 1.0 Call evaluate -->
  <line x1="95" y1="222" x2="285" y2="222" class="msg-call" />
  <text x="105" y="217" class="msg-label">1.0: POST /v1/transactions/evaluate [X-API-Key: pp_live_..., Body: TransactionData]</text>

  <!-- 1.1 Controller -> RuleEvaluator -->
  <line x1="295" y1="240" x2="525" y2="240" class="msg-call" />
  <text x="305" y="235" class="msg-label">1.1: evaluate(context: EvaluationContext, ruleSet: List&lt;Rule&gt;)</text>

  <!-- Loop over rules in ConditionEvaluator -->
  <line x1="535" y1="280" x2="765" y2="280" class="msg-call" />
  <text x="545" y="275" class="msg-label">1.2: evaluateCondition(condition: "amount &gt; 1000", context)</text>
  <line x1="765" y1="315" x2="535" y2="315" class="msg-return" />
  <text x="580" y="310" class="return-label">true (Regla 1 activada: 50 pts)</text>

  <line x1="535" y1="355" x2="765" y2="355" class="msg-call" />
  <text x="545" y="350" class="msg-label">1.3: evaluateCondition(condition: "velocity.device_tx_10m &gt;= 3", context)</text>
  <line x1="765" y1="390" x2="535" y2="390" class="msg-return" />
  <text x="580" y="385" class="return-label">true (Regla 2 activada: 40 pts)</text>

  <line x1="535" y1="430" x2="765" y2="430" class="msg-call" />
  <text x="545" y="425" class="msg-label">1.4: evaluateCondition(condition: "cardCountry in ['PE','CL']", context)</text>
  <line x1="765" y1="465" x2="535" y2="465" class="msg-return" />
  <text x="580" y="460" class="return-label">true (Regla 3 activada: 35 pts)</text>

  <line x1="535" y1="505" x2="765" y2="505" class="msg-call" />
  <text x="545" y="500" class="msg-label">1.5: evaluateCondition(condition: "currency == 'PEN'", context)</text>
  <line x1="765" y1="540" x2="535" y2="540" class="msg-return" />
  <text x="580" y="535" class="return-label">true (Regla 4 evaluada)</text>

  <!-- 1.6 ScoreCalculator -->
  <line x1="535" y1="600" x2="985" y2="600" class="msg-call" />
  <text x="545" y="595" class="msg-label">1.6: calculateScore(triggeredRules: [50, 40, 35])</text>

  <!-- Self-call Score calculation with 100 pt cap -->
  <line x1="985" y1="640" x2="995" y2="640" class="msg-call" />
  <text x="1005" y="635" class="msg-label">Suma: 50+40+35 = 125</text>
  <line x1="995" y1="660" x2="985" y2="660" class="msg-return" />
  <text x="1005" y="665" class="return-label">Math.min(100, 125) = 100 pts</text>

  <line x1="985" y1="700" x2="535" y2="700" class="msg-return" />
  <text x="650" y="695" class="return-label">score = 100 (Tope estricto aplicado)</text>

  <!-- 1.7 Determine Decision -->
  <line x1="535" y1="735" x2="985" y2="735" class="msg-call" />
  <text x="545" y="730" class="msg-label">1.7: determineDecision(score: 100, reviewThreshold: 50, rejectThreshold: 80)</text>

  <line x1="985" y1="785" x2="535" y2="785" class="msg-return" />
  <text x="650" y="780" class="return-label">DecisionResult(decision: "REJECT", score: 100, reasons: [...])</text>

  <!-- Return to Controller -->
  <line x1="525" y1="830" x2="295" y2="830" class="msg-return" />
  <text x="320" y="825" class="return-label">EvaluationResponse(transactionId, decision: "REJECT", score: 100)</text>

  <!-- Return to Actor -->
  <line x1="285" y1="875" x2="95" y2="875" class="msg-return" />
  <text x="105" y="870" class="return-label">200 OK {"decision": "REJECT", "score": 100, "triggers": ["Monto alto", "Velocidad extrema"]}</text>

</svg>
