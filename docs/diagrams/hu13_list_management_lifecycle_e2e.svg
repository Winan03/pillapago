<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 1180" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .uml-title { fill: #1e293b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 19px; font-weight: 700; }
      .uml-subtitle { fill: #64748b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; }

      /* Lifelines */
      .lifeline-line { stroke: #0284c7; stroke-width: 1.5; stroke-dasharray: 6 5; }

      /* Participant boxes */
      .participant-box { fill: #f0f9ff; stroke: #0284c7; stroke-width: 1.5; rx: 4; }
      .participant-name { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; text-anchor: middle; }
      .participant-type { fill: #0369a1; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; text-anchor: middle; }

      /* Actor Stick Figure */
      .actor-icon { stroke: #0284c7; stroke-width: 1.8; fill: none; stroke-linecap: round; }

      /* Activation Bars */
      .activation-bar { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1.5; }
      .activation-bar-warn { fill: #fef9c3; stroke: #ca8a04; stroke-width: 1.5; }
      .activation-bar-err { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
      .activation-bar-ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }

      /* Message Lines */
      .msg-call { stroke: #0f172a; stroke-width: 1.5; marker-end: url(#arrow-sync); }
      .msg-return { stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 5 4; marker-end: url(#arrow-reply); }
      .msg-shortcircuit { stroke: #dc2626; stroke-width: 1.8; marker-end: url(#arrow-shortcircuit); }
      .msg-allowcircuit { stroke: #16a34a; stroke-width: 1.8; marker-end: url(#arrow-allowcircuit); }

      /* Labels */
      .msg-label { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; font-weight: 500; }
      .return-label { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; font-weight: 500; font-style: italic; }
      .error-label { fill: #dc2626; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; font-weight: 600; }
      .tech-note { fill: #0369a1; font-family: ui-monospace, monospace; font-size: 10px; }

      /* Fragment Boxes (alt, opt, group) */
      .fragment-box { fill: none; stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 4 2; }
      .fragment-box-red { fill: rgba(254,226,226,0.25); stroke: #dc2626; stroke-width: 1.2; stroke-dasharray: 4 2; }
      .fragment-box-green { fill: rgba(220,252,231,0.25); stroke: #16a34a; stroke-width: 1.2; stroke-dasharray: 4 2; }
      .fragment-header { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 1.2; }
      .fragment-header-red { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.2; }
      .fragment-header-green { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.2; }
      .fragment-label { fill: #334155; font-family: ui-monospace, monospace; font-size: 11px; font-weight: 700; }
      .fragment-label-red { fill: #991b1b; font-family: ui-monospace, monospace; font-size: 11px; font-weight: 700; }
      .fragment-label-green { fill: #166534; font-family: ui-monospace, monospace; font-size: 11px; font-weight: 700; }
      .fragment-divider { stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 3 3; }
      .fragment-guard { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; font-weight: 600; }

      /* Badges */
      .badge-block { fill: #fee2e2; stroke: #dc2626; stroke-width: 1; }
      .badge-allow { fill: #dcfce7; stroke: #16a34a; stroke-width: 1; }
      .badge-text-block { fill: #dc2626; font-family: ui-monospace, monospace; font-size: 10px; font-weight: 700; text-anchor: middle; }
      .badge-text-allow { fill: #16a34a; font-family: ui-monospace, monospace; font-size: 10px; font-weight: 700; text-anchor: middle; }
    </style>

    <marker id="arrow-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f172a" />
    </marker>
    <marker id="arrow-reply" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrow-shortcircuit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-allowcircuit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />

  <!-- Header -->
  <text x="50" y="45" class="uml-title">HU-13 · Ciclo de Vida E2E: Listas de Bloqueo y Confianza (Cache O(1) &amp; Hot Path Short-Circuit)</text>
  <text x="50" y="68" class="uml-subtitle">Pillapago Antifraude · Gestión por RISK_ANALYST, Cifrado Tink AES-256-GCM + Blind Index, y Evaluación In-Memory Sub-Milisegundo</text>

  <!-- ========================================== -->
  <!-- LIFELINES & PARTICIPANTS                   -->
  <!-- ========================================== -->

  <!-- Lifeline 1: Risk Analyst (x=100) -->
  <circle cx="100" cy="100" r="12" class="actor-icon" />
  <line x1="100" y1="112" x2="100" y2="132" class="actor-icon" />
  <line x1="85" y1="120" x2="115" y2="120" class="actor-icon" />
  <line x1="100" y1="132" x2="88" y2="152" class="actor-icon" />
  <line x1="100" y1="132" x2="112" y2="152" class="actor-icon" />
  <text x="100" y="172" class="participant-name">Risk Analyst</text>
  <text x="100" y="186" class="participant-type">&lt;&lt;Actor: RISK_ANALYST&gt;&gt;</text>
  <line x1="100" y1="195" x2="100" y2="1120" class="lifeline-line" />

  <!-- Lifeline 2: API Controller & RBAC (x=300) -->
  <rect x="230" y="130" width="140" height="48" class="participant-box" />
  <text x="300" y="152" class="participant-name">ListEntryController</text>
  <text x="300" y="167" class="participant-type">&lt;&lt;REST API / RBAC&gt;&gt;</text>
  <line x1="300" y1="178" x2="300" y2="1120" class="lifeline-line" />

  <!-- Lifeline 3: ListService (x=500) -->
  <rect x="430" y="130" width="140" height="48" class="participant-box" />
  <text x="500" y="152" class="participant-name">ListService</text>
  <text x="500" y="167" class="participant-type">&lt;&lt;Crypto &amp; Business&gt;&gt;</text>
  <line x1="500" y1="178" x2="500" y2="1120" class="lifeline-line" />

  <!-- Lifeline 4: ListEntryRepository / DB (x=700) -->
  <rect x="630" y="130" width="140" height="48" class="participant-box" />
  <text x="700" y="152" class="participant-name">PostgreSQL DB</text>
  <text x="700" y="167" class="participant-type">&lt;&lt;list_entries table&gt;&gt;</text>
  <line x1="700" y1="178" x2="700" y2="1120" class="lifeline-line" />

  <!-- Lifeline 5: ListCacheService (x=900) -->
  <rect x="830" y="130" width="140" height="48" class="participant-box" />
  <text x="900" y="152" class="participant-name">ListCacheService</text>
  <text x="900" y="167" class="participant-type">&lt;&lt;RAM Concurrent O(1)&gt;&gt;</text>
  <line x1="900" y1="178" x2="900" y2="1120" class="lifeline-line" />

  <!-- Lifeline 6: TransactionEvaluationService (x=1120) -->
  <rect x="1040" y="130" width="160" height="48" class="participant-box" />
  <text x="1120" y="152" class="participant-name">EvaluationService</text>
  <text x="1120" y="167" class="participant-type">&lt;&lt;Hot Path Evaluator&gt;&gt;</text>
  <line x1="1120" y1="178" x2="1120" y2="1120" class="lifeline-line" />

  <!-- ========================================== -->
  <!-- PHASE 1: GESTION Y ALTA EN LISTA (CRUD)    -->
  <!-- ========================================== -->

  <!-- Alt: Control RBAC -->
  <rect x="60" y="215" width="460" height="90" class="fragment-box" />
  <path d="M 60 215 L 110 215 L 115 227 L 60 227 Z" class="fragment-header" />
  <text x="65" y="225" class="fragment-label">alt</text>
  <text x="125" y="226" class="fragment-guard">[Rol != RISK_ANALYST (e.g. MERCHANT_ADMIN)]</text>

  <line x1="100" y1="240" x2="300" y2="240" class="msg-call" />
  <text x="120" y="235" class="msg-label">POST /v1/lists (JWT No Autorizado)</text>

  <rect x="295" y="240" width="10" height="50" class="activation-bar-err" />

  <line x1="300" y1="275" x2="100" y2="275" class="msg-return" />
  <text x="130" y="270" class="error-label">403 Forbidden (RBAC Criterio 5 cumplido)</text>

  <!-- Happy Path: Alta por Risk Analyst -->
  <line x1="100" y1="330" x2="300" y2="330" class="msg-call" />
  <text x="115" y="325" class="msg-label">POST /v1/lists {type: IP, value: '203.0.113.42', list: BLOCK, reason: 'Botnet activa'}</text>

  <rect x="295" y="330" width="10" height="230" class="activation-bar" />

  <line x1="300" y1="355" x2="500" y2="355" class="msg-call" />
  <text x="315" y="350" class="msg-label">createEntry(merchantId, request)</text>

  <rect x="495" y="355" width="10" height="185" class="activation-bar" />

  <!-- Internal Crypto in ListService -->
  <line x1="505" y1="375" x2="540" y2="375" class="msg-call" />
  <line x1="540" y1="375" x2="540" y2="395" class="msg-call" />
  <line x1="540" y1="395" x2="505" y2="395" class="msg-call" />
  <text x="545" y="388" class="tech-note">1. Blind Index HMAC-SHA256 (RNF-15)</text>
  <text x="545" y="403" class="tech-note">2. Tink AES-256-GCM Encrypt &amp; Masking</text>

  <!-- Check Duplicate & Save DB -->
  <line x1="505" y1="420" x2="700" y2="420" class="msg-call" />
  <text x="515" y="415" class="msg-label">INSERT INTO list_entries (hashed, encrypted, masked...)</text>

  <rect x="695" y="420" width="10" height="40" class="activation-bar" />

  <line x1="700" y1="450" x2="505" y2="450" class="msg-return" />
  <text x="545" y="445" class="return-label">Entity Persisted (id, version)</text>

  <!-- Refresh In-Memory Cache -->
  <line x1="505" y1="475" x2="900" y2="475" class="msg-call" />
  <text x="525" y="470" class="msg-label">refreshMerchant(merchantId) [Atómico / Concurrent]</text>

  <rect x="895" y="475" width="10" height="45" class="activation-bar-ok" />
  <line x1="900" y1="510" x2="505" y2="510" class="msg-return" />
  <text x="555" y="505" class="return-label">Cache Actualizada en RAM O(1)</text>

  <!-- Audit Log & 201 Response -->
  <line x1="505" y1="525" x2="540" y2="525" class="msg-call" />
  <line x1="540" y1="525" x2="540" y2="538" class="msg-call" />
  <line x1="540" y1="538" x2="505" y2="538" class="msg-call" />
  <text x="545" y="534" class="tech-note">AUDIT_LOGGER.info([AUDIT-HU13] ALTA_LISTA...)</text>

  <line x1="495" y1="545" x2="305" y2="545" class="msg-return" />
  <text x="325" y="540" class="return-label">ListEntryResponseDto (203.0.***.***)</text>

  <line x1="295" y1="555" x2="100" y2="555" class="msg-return" />
  <text x="135" y="550" class="return-label">201 Created {id, valueMasked, listType: BLOCK}</text>

  <!-- ========================================== -->
  <!-- PHASE 2: HOT PATH EVALUATION SHORT-CIRCUIT -->
  <!-- ========================================== -->

  <!-- Short-Circuit Group: BLOCKLIST MATCH -->
  <rect x="60" y="590" width="1230" height="230" class="fragment-box-red" />
  <path d="M 60 590 L 140 590 L 145 602 L 60 602 Z" class="fragment-header-red" />
  <text x="65" y="600" class="fragment-label-red">HOT PATH [1]</text>
  <text x="155" y="601" class="fragment-guard">Transacción Entrante con IP/Dispositivo en BLOCKLIST (Short-Circuit Sub-Milisegundo)</text>

  <line x1="100" y1="625" x2="1120" y2="625" class="msg-call" />
  <text x="280" y="620" class="msg-label">POST /v1/evaluations {transaction_id: "tx_99", ip: "203.0.113.42", amount: 1500.00}</text>

  <rect x="1115" y="625" width="10" height="175" class="activation-bar-err" />

  <line x1="1125" y1="645" x2="905" y2="645" class="msg-call" />
  <text x="930" y="640" class="msg-label">checkInMemoryLists(merchantId, evaluationContext)</text>

  <rect x="895" y="645" width="10" height="50" class="activation-bar" />
  <text x="735" y="665" class="tech-note">Lookup O(1) in Set&lt;String&gt; hashedValues</text>

  <line x1="895" y1="685" x2="1115" y2="685" class="msg-shortcircuit" />
  <text x="925" y="680" class="error-label">MATCH BLOCKLIST! Reason: "Botnet activa" (Score: 100)</text>

  <!-- Notice bypass of DB and Rule Engine -->
  <rect x="940" y="700" width="70" height="20" class="badge-block" rx="3" />
  <text x="975" y="714" class="badge-text-block">REJECT</text>
  <text x="1015" y="714" class="tech-note">Bypass Redis &amp; Rule Engine (0ms added)</text>

  <line x1="1115" y1="785" x2="100" y2="785" class="msg-return" />
  <text x="320" y="780" class="error-label">200 OK {recommendation: "REJECT", score: 100, trigger: "BLOCKLIST_MATCH"}</text>

  <!-- Short-Circuit Group: ALLOWLIST MATCH -->
  <rect x="60" y="845" width="1230" height="230" class="fragment-box-green" />
  <path d="M 60 845 L 140 845 L 145 857 L 60 857 Z" class="fragment-header-green" />
  <text x="65" y="855" class="fragment-label-green">HOT PATH [2]</text>
  <text x="155" y="856" class="fragment-guard">Transacción Entrante con Terminal/Dispositivo en ALLOWLIST (VIP Whitelist Bypass)</text>

  <line x1="100" y1="880" x2="1120" y2="880" class="msg-call" />
  <text x="280" y="875" class="msg-label">POST /v1/evaluations {transaction_id: "tx_pos", device_id: "POS_TIENDA_OFICIAL", amount: 4800.00}</text>

  <rect x="1115" y="880" width="10" height="175" class="activation-bar-ok" />

  <line x1="1125" y1="900" x2="905" y2="900" class="msg-call" />
  <text x="930" y="895" class="msg-label">checkInMemoryLists(merchantId, evaluationContext)</text>

  <rect x="895" y="900" width="10" height="50" class="activation-bar" />
  <text x="735" y="920" class="tech-note">Lookup O(1) in Set&lt;String&gt; hashedValues</text>

  <line x1="895" y1="940" x2="1115" y2="940" class="msg-allowcircuit" />
  <text x="925" y="935" class="return-label" style="fill:#166534; font-weight:700;">MATCH ALLOWLIST! Terminal verificado (Score: 0)</text>

  <rect x="940" y="955" width="75" height="20" class="badge-allow" rx="3" />
  <text x="977" y="969" class="badge-text-allow">APPROVE</text>
  <text x="1025" y="969" class="tech-note">Whitelist Short-Circuit (Skip Rules)</text>

  <line x1="1115" y1="1040" x2="100" y2="1040" class="msg-return" />
  <text x="320" y="1035" class="return-label" style="fill:#15803d; font-weight:700;">200 OK {recommendation: "APPROVE", score: 0, trigger: "ALLOWLIST_MATCH"}</text>

</svg>
