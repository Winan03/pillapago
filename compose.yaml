services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: pillapago-postgres
    # Modo rootless compatible: PostgreSQL 16-alpine funciona sin privilegios elevados
    environment:
      - POSTGRES_DB=pillapago
      - POSTGRES_USER=${POSTGRES_USER:-pillapago_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pillapago_pass}
    # Volumen nombrado desactivado para modo rootless; usando directorio directo
    volumes: []
    ports:
      - "127.0.0.1:5433:5432/tcp"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-pillapago_user}", "-d", "pillapago"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Compartir red solo en loopback para aislamiento multi-tenant
    network_mode: "bridge"

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: pillapago-redis
    # Modo sin persistencia en disco (según spec RNF-30) y con contraseña (RNF-29)
    command: ["redis-server", "--save", "", "--appendonly", "no", "--requirepass", "${REDIS_PASSWORD:-redis_pass}"]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_pass}
    ports:
      - "127.0.0.1:6379:6379/tcp"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-redis_pass} ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    network_mode: "bridge"

# Volúmenes nombrados desactivados para modo rootless en Windows
# Usar directorios locales en su lugar si es necesario:
#
# volumes:
#   pg_data:

networks:
  default:
    driver: bridge