spring:
  datasource:
    url: jdbc:h2:mem:pillapago_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

jwt:
  secret: pillapago-super-secret-key-for-jwt-signing-256-bits-minimum-value-here
  access-token-expiration-ms: 900000
