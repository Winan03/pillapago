name: CI Pillapago

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-verify:
    name: Build & Verify
    runs-on: windows-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pillapago
          POSTGRES_USER: pillapago_user
          POSTGRES_PASSWORD: pillapago_pass
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pillapago_user -d pillapago"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        env:
          REDIS_URL: redis://redis_user:redis_pass@127.0.0.1:6379
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |

      - name: Validate Maven configuration
        run: mvn --version

      - name: Compile project
        run: mvn compile -B -Dspring.profiles.active=local

      - name: Run Flyway migration
        run: mvn flyway:migrate -B -Dflyway.user=pillapago_user -Dflyway.password=pillapago_pass

      - name: Execute unit and integration tests
        run: mvn verify -B \
          -Dspring.profiles.active=local \
          -Dtestcontainers.output.enable=true \
          -Djacoco.exclusion='com.pillapago.**=*Test'

      - name: Generate coverage report
        run: mvn jacoco:report -B

      - name: Verify actuator health endpoint
        run: |
          curl -s http://localhost:8080/actuator/health | jq '.status' | grep -q "UP" || exit 1